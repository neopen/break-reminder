# ============================================================
# Breakly - Market Publishing Workflow
#
# Automatically publish/update:
#   - WinGet: submit/update package manifest PR
#   - Snap Store: upload to candidate channel
#
# Trigger:
#   - GitHub Release published
#   - Manual dispatch (published release tag required)
#
# Required GitHub Secrets:
#   - WINGET_TOKEN
#   - SNAPCRAFT_STORE_CREDENTIALS
#
# Required GitHub Variables:
#   - WINGET_PACKAGE_ID
#
# Notes:
#   - First WinGet submission must be created manually.
#   - Subsequent releases are updated automatically.
#   - Snap is uploaded to candidate, not stable.
#   - Microsoft Store publishing remains manual.
# ============================================================

name: Market Publish

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: market-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # ==========================================================
  # Resolve Release
  # Validate that the requested tag belongs to a published
  # GitHub Release.
  # ==========================================================
  release:
    name: Validate Release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$EVENT_TAG"
          else
            TAG="$INPUT_TAG"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid stable release tag: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            --jq '
              if .isDraft or .isPrerelease
              then error("Release must be published and not a prerelease")
              else "Release verified"
              end
            '

  # ==========================================================
  # WinGet
  # Submit a package update PR to microsoft/winget-pkgs.
  #
  # IMPORTANT:
  #   - The initial package manifest must already exist.
  #   - Use wingetcreate new for the first submission.
  #   - Subsequent releases use wingetcreate update.
  #
  # Required:
  #   - WINGET_TOKEN secret
  #   - WINGET_PACKAGE_ID repository variable
  # ==========================================================
  winget:
    name: Publish WinGet
    if: ${{ vars.WINGET_ENABLED == 'true' }}
    runs-on: windows-latest
    needs: release

    steps:
      - name: Download release installer and calculate SHA256
        id: installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $asset = "Breakly-$env:VERSION-windows-x64-setup.exe"
          $file = Join-Path $env:TEMP $asset

          Write-Host "Downloading release installer: $asset"

          gh release download $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $asset `
            --dir $env:TEMP

          if (-not (Test-Path $file)) {
            throw "Release installer not found: $asset"
          }

          $item = Get-Item $file

          if ($item.Length -le 0) {
            throw "Downloaded installer is empty"
          }

          $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToUpperInvariant()

          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$asset"

          "url=$url" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT

          Write-Host "Installer: $asset"
          Write-Host "SHA256: $hash"

      # wingetcreate update generates and submits the manifest update PR.
      # WINGET_PACKAGE_ID must be configured as a repository variable.
      # WINGET_TOKEN must be configured as a repository secret.
      #
      # The initial manifest must already exist in microsoft/winget-pkgs.
      - name: Update WinGet manifest
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          PACKAGE_ID: ${{ vars.WINGET_PACKAGE_ID }}
          VERSION: ${{ needs.release.outputs.version }}
          URL: ${{ steps.installer.outputs.url }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            throw "WINGET_TOKEN secret is not configured"
          }

          if ([string]::IsNullOrWhiteSpace($env:PACKAGE_ID)) {
            throw "WINGET_PACKAGE_ID repository variable is not configured"
          }

          $tool = Join-Path $env:TEMP "wingetcreate.exe"

          Write-Host "Downloading wingetcreate..."

          Invoke-WebRequest `
            -Uri "https://aka.ms/wingetcreate/latest" `
            -OutFile $tool

          if (-not (Test-Path $tool)) {
            throw "wingetcreate executable was not downloaded"
          }

          Write-Host "Updating package manifest..."
          Write-Host "Package: $env:PACKAGE_ID"
          Write-Host "Version: $env:VERSION"

          & $tool update $env:PACKAGE_ID `
            --version $env:VERSION `
            --urls $env:URL `
            --submit `
            --token $env:WINGET_TOKEN `
            --no-open

          if ($LASTEXITCODE -ne 0) {
            throw "wingetcreate update failed with exit code $LASTEXITCODE"
          }

  # ==========================================================
  # Snap Store
  # Build using the Tauri/Snapcraft packaging approach.
  # Upload to candidate; do not promote automatically to stable.
  #
  # Required:
  #   - SNAPCRAFT_STORE_CREDENTIALS secret
  #   - snap/snapcraft.yaml
  # ==========================================================
  snap:
    name: Publish Snap (candidate)
    runs-on: ubuntu-22.04
    needs: release

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      # Snap 构建不需要更新签名产物，并需把 deb 的中文 desktop 文件名改为 breakly.desktop
      - name: Prepare snapcraft build
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('snap/snapcraft.yaml')
          source = path.read_text()

          old_build = 'npm run tauri build -- --bundles deb'
          new_build = (
              "npm run tauri build -- --bundles deb "
              "--config '{\"bundle\":{\"createUpdaterArtifacts\":false}}'"
          )
          if new_build not in source:
              if old_build not in source:
                  raise SystemExit('tauri build command not found in snapcraft.yaml')
              source = source.replace(old_build, new_build, 1)

          anchor = '      echo "Validating desktop entry..."'
          prepare = (
              '      echo "Preparing desktop entry..."\n'
              '      DESKTOP_FILES=("$SNAPCRAFT_PART_INSTALL"/usr/share/applications/*.desktop)\n'
              '      if [ "${#DESKTOP_FILES[@]}" -ne 1 ]; then\n'
              '        echo "Expected exactly one desktop entry, found ${#DESKTOP_FILES[@]}"\n'
              '        exit 1\n'
              '      fi\n'
              '      if [ "${DESKTOP_FILES[0]}" != "$SNAPCRAFT_PART_INSTALL/usr/share/applications/breakly.desktop" ]; then\n'
              '        mv "${DESKTOP_FILES[0]}" "$SNAPCRAFT_PART_INSTALL/usr/share/applications/breakly.desktop"\n'
              '      fi\n'
              '\n'
          )
          if 'Preparing desktop entry' not in source:
              if anchor not in source:
                  raise SystemExit('desktop entry anchor not found in snapcraft.yaml')
              source = source.replace(anchor, prepare + anchor, 1)

          path.write_text(source)
          PY

          grep -nE 'tauri build|Preparing desktop entry' snap/snapcraft.yaml

      - name: Verify Snapcraft configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f snap/snapcraft.yaml ]; then
            echo "::error::snap/snapcraft.yaml not found"
            exit 1
          fi

          if ! grep -q '^name: breakly$' snap/snapcraft.yaml; then
            echo "::error::Snap package name must be breakly"
            exit 1
          fi

      - name: Install Snapcraft
        run: |
          sudo snap install snapcraft --classic

      - name: Set Snap version from release tag
        env:
          SNAP_VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          SNAP_FILE="snap/snapcraft.yaml"

          sed -i \
            "s/^version: .*/version: '${SNAP_VERSION}'/" \
            "$SNAP_FILE"

          grep '^version:' "$SNAP_FILE"

      - name: Build Snap
        shell: bash
        run: |
          set -euo pipefail

          # build-packages 需要 root 权限；同时保留 runner 的 Node / Rust 环境
          sudo env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            snapcraft --destructive-mode

          # 生成的文件与 snapcraft 状态目录归 root 所有，交给 runner 用户以便后续上传
          sudo chown "$USER:$USER" ./*.snap
          sudo chown -R "$USER:$USER" "$HOME/.local/state/snapcraft" "$HOME/.cache/snapcraft" 2>/dev/null || true

          shopt -s nullglob
          SNAP_FILES=( *.snap )

          if [ "${#SNAP_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Snap package, found ${#SNAP_FILES[@]}"
            exit 1
          fi

          echo "Snap package generated:"
          ls -lh "${SNAP_FILES[0]}"

      - name: Upload Snap to candidate channel
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error::SNAPCRAFT_STORE_CREDENTIALS secret is not configured"
            exit 1
          fi

          shopt -s nullglob
          SNAP_FILES=( *.snap )

          if [ "${#SNAP_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Snap package, found ${#SNAP_FILES[@]}"
            exit 1
          fi

          snapcraft upload "${SNAP_FILES[0]}" --release=candidate

          echo "Snap uploaded to candidate channel successfully."
