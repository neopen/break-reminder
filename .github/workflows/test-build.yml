name: Test Build (Windows, unsigned)

on:
  workflow_dispatch:
  # 测试标签触发：分支上也可直接产出安装包，不会触发正式发布
  push:
    tags:
      - 'test-*'

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Verify version consistency
        run: npm run version:check

      # 构建 NSIS 安装版（验证系统通知需要安装），同时产出可运行的 exe。
      # 关闭 updater 产物，避免测试包依赖更新签名密钥。
      - name: Build unsigned executable and NSIS installer
        shell: bash
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Rename Windows installer
        shell: bash
        run: |
          INSTALLER=$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*-setup.exe' ! -name 'Breakly-Setup.exe' | head -n 1)
          if [ -z "$INSTALLER" ]; then
            echo "::error::NSIS installer not found"
            exit 1
          fi
          cp "$INSTALLER" src-tauri/target/release/bundle/nsis/Breakly-Setup.exe
          rm "$INSTALLER"

      - name: List build output
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release -Filter *.exe | Select-Object Name, Length
          Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object Name, Length

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: breakly-test-${{ github.sha }}
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 7
