name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: '--bundles nsis'
            rust_targets: 'x86_64-pc-windows-msvc'

          - name: macOS Universal
            os: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

          - name: Linux x64
            os: ubuntu-22.04
            args: '--bundles appimage,deb'
            rust_targets: 'x86_64-unknown-linux-gnu'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Verify version consistency
        run: npm run version:check

      - name: Verify tag matches version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"

          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Version mismatch: package.json=$VERSION tag=$TAG"
            exit 1
          fi

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # 自动更新签名（必须配置，否则 createUpdaterArtifacts 会失败）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # 可选：macOS 代码签名 / 公证
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # 可选：Windows 代码签名
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: '别坐了 ${{ github.ref_name }}'
          releaseBody: |
            桌面端安装包与自动更新文件由 Tauri 2 自动构建。

            - Windows: NSIS 安装包
            - macOS: Universal DMG / APP
            - Linux: AppImage / DEB
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # 自动更新继续使用 Tauri 生成的原始产物；
      # 额外上传带版本号与平台/架构的副本，方便用户按系统选择下载。
      - name: Upload versioned Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          INSTALLER=$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*-setup.exe' ! -name 'Breakly-*-x64-Setup.exe' | head -n 1)
          if [ -z "$INSTALLER" ]; then
            echo "::error::NSIS installer not found"
            exit 1
          fi
          cp "$INSTALLER" "Breakly-${VERSION}-x64-Setup.exe"
          gh release upload "${{ github.ref_name }}" "Breakly-${VERSION}-x64-Setup.exe" --clobber

          EXE=$(find src-tauri/target/release -maxdepth 1 -name '*.exe' ! -name 'Breakly-*-x64.exe' | head -n 1)
          if [ -n "$EXE" ]; then
            cp "$EXE" "Breakly-${VERSION}-x64.exe"
            gh release upload "${{ github.ref_name }}" "Breakly-${VERSION}-x64.exe" --clobber
          fi

      - name: Upload versioned macOS DMG
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DMG=$(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' | head -n 1)
          if [ -z "$DMG" ]; then
            echo "::error::macOS DMG not found"
            exit 1
          fi
          cp "$DMG" "Breakly-${VERSION}-universal.dmg"
          gh release upload "${{ github.ref_name }}" "Breakly-${VERSION}-universal.dmg" --clobber

      - name: Upload versioned Linux packages
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' | head -n 1)
          DEB=$(find src-tauri/target/release/bundle/deb -type f -name '*.deb' | head -n 1)

          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" "Breakly-${VERSION}-x64.AppImage"
            gh release upload "${{ github.ref_name }}" "Breakly-${VERSION}-x64.AppImage" --clobber
          fi
          if [ -n "$DEB" ]; then
            cp "$DEB" "Breakly-${VERSION}-x64.deb"
            gh release upload "${{ github.ref_name }}" "Breakly-${VERSION}-x64.deb" --clobber
          fi
