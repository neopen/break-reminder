
# ==========================================
# Application
# ==========================================

appId: com.neopen.activebreakclock
productName: 别坐了
copyright: Copyright © 2026 neopen

# Electron 应用语言
electronLanguages:
  - zh-CN

# ==========================================
# Directories
# ==========================================

directories:
  # 统一图标资源目录
  buildResources: build

  # 打包输出目录
  output: release

# ==========================================
# Application Icon
# ==========================================

# 三个平台统一使用 SVG 原始图标
# electron-builder 根据目标平台处理图标资源
icon: build/icon.svg

# ==========================================
# Extra Resources
# ==========================================

extraResources:
  - from: src/renderer/icons
    to: icons
    filter:
      - "**/*"

# ==========================================
# Files
# ==========================================

files:
  - "dist/main/**/*"
  - "dist/preload/**/*"
  - "dist/renderer/**/*"

  - "!dist/**/*.map"
  - "!**/*.log"
  - "!**/*.md"
  - "!**/*.ts"
  - "!**/*.po"
  - "!**/*.mo"
  - "!**/*.test.js"
  - "!**/*.spec.js"
  - "!**/docs/**/*"
  - "!**/scripts/**/*"
  - "!**/test/**/*"
  - "!**/imgs/**/*"
  - "!**/.storage/**/*"
  - "!**/.tmp/**/*"

# ==========================================
# Native Modules
# ==========================================

asar: true

asarUnpack:
  - "**/*.node"

# ==========================================
# Windows
# ==========================================

win:
  target:
    - target: nsis
      arch:
        - x64

    - target: portable
      arch:
        - x64

  icon: build/icon.svg

  compression: maximum

  requestedExecutionLevel: asInvoker

  artifactName: HealthClock-${version}-x64-${target}.${ext}

# ==========================================
# NSIS Installer
# ==========================================

nsis:
  oneClick: false

  perMachine: false

  allowToChangeInstallationDirectory: true

  createDesktopShortcut: true

  createStartMenuShortcut: true

  shortcutName: 别坐了

  runAfterFinish: true

  deleteAppDataOnUninstall: false

  artifactName: HealthClock-${version}-x64-Setup.${ext}

# ==========================================
# Portable
# ==========================================

portable:
  artifactName: HealthClock-${version}-x64-Portable.${ext}

  requestExecutionLevel: user

# ==========================================
# macOS
# ==========================================

mac:
  target:
    - dmg
    - zip

  icon: build/icon.svg

  category: public.app-category.healthcare-fitness

  hardenedRuntime: true

  gatekeeperAssess: false

  asar: true

  asarUnpack:
    - "**/*.node"

  artifactName: HealthClock-${version}-${arch}.${ext}

  # 暂不进行代码签名
  identity: null

# ==========================================
# DMG
# ==========================================

dmg:
  title: 别坐了-${version}

  iconSize: 100

  contents:
    - x: 130
      y: 220

    - x: 410
      y: 220
      type: link
      path: /Applications

  window:
    width: 540
    height: 380

# ==========================================
# Linux
# ==========================================

linux:
  target:
    - deb
    - rpm
    - AppImage

  icon: build/icon.svg

  category: Utility

  executableName: healthclock

  artifactName: HealthClock-${version}-${arch}.${ext}

  desktop:
    entry:
      Name: 别坐了
      Comment: 健康提醒应用，帮你打破久坐循环
      Type: Application
      Categories: Utility;
      Terminal: false

# ==========================================
# AppImage
# ==========================================

appImage:
  artifactName: HealthClock-${version}-${arch}.AppImage

  description: 健康提醒应用，帮你打破久坐循环

  category: Utility

# ==========================================
# DEB
# ==========================================

deb:
  artifactName: HealthClock-${version}-${arch}.deb

  depends:
    - libnotify-bin
    - libgtk-3-0

  priority: optional

  maintainer: neopen <helpenx+clock@gmail.com>

  packageCategory: utils

  vendor: neopen

# ==========================================
# RPM
# ==========================================

rpm:
  artifactName: HealthClock-${version}-${arch}.rpm

  depends:
    - libnotify
    - gtk3

  maintainer: neopen <helpenx+clock@gmail.com>

  packageCategory: Utilities

  vendor: neopen
