    <style>
      /* 预览专用：顶部下载安装入口 */
      .preview-cta {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        z-index: 30000;
        display: flex;
        align-items: center;
        justify-content: center;

        background: linear-gradient(90deg, #f97316 0%, #ef4444 52%, #c026d3 100%);
        box-shadow: 0 10px 30px -12px rgba(239, 68, 68, 0.85);
      }

      .preview-cta__label {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.06em;
        opacity: 0.95;
      }

      .preview-cta__button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 24px;
        font-size: 14px;
        font-weight: 800;
        color: #9a3412;
        text-decoration: none;
        background: #fff;
        border-radius: 999px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
        animation: preview-cta-pulse 2.2s ease-in-out infinite;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease;
      }

      .preview-cta__button:hover {
        transform: translateY(-1px) scale(1.04);
        box-shadow: 0 6px 22px rgba(255, 255, 255, 0.5);
      }

      @keyframes preview-cta-pulse {
        0%,
        100% {
          box-shadow:
            0 4px 14px rgba(0, 0, 0, 0.18),
            0 0 0 0 rgba(255, 255, 255, 0.45);
        }
        50% {
          box-shadow:
            0 4px 14px rgba(0, 0, 0, 0.18),
            0 0 0 9px rgba(255, 255, 255, 0);
        }
      }

      body {
        padding-top: 58px;
      }

      .app-shell {
        min-height: calc(100vh - 58px) !important;
      }

      .app-content {
        min-height: calc(100vh - 90px) !important;
      }

      @media (max-width: 460px) {
        .preview-cta {
          gap: 10px;
        }

          display: none;
        }
